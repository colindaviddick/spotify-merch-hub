# fly.toml app configuration file generated for spotify-merch-hub on 2026-11-18T02:15:35Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'spotify-merch-hub'
primary_region = 'ams'

[build]

[env]
  PORT = "8080"
[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = [ "app" ]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"